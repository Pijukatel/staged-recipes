context:
  version: "1.7.3"
  python_min: "3.10"

# conda has no equivalent of PyPI "extras", so each optional dependency group
# from crawlee's pyproject.toml is exposed as its own `crawlee-with-<extra>`
# output, plus a `crawlee-all` meta-package that pulls them all in.
# The `stagehand` extra is omitted because its `stagehand` dependency is not
# available on conda-forge; `crawlee-all` therefore also excludes it.
recipe:
  name: crawlee
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/crawlee/crawlee-${{ version }}.tar.gz
  sha256: 5c0a2dad5ae13bc5e07f4e0184de54837e2ad465c4d3580637d8fa70d701b163

build:
  number: 0

outputs:
  - package:
      name: crawlee
    build:
      noarch: python
      script: python -m pip install . -vv --no-deps --no-build-isolation
      number: 0
    requirements:
      host:
        - python ${{ python_min }}.*
        - pip
        - hatchling
      run:
        - python >=${{ python_min }}
        - async-timeout >=5.0.1
        - cachetools >=5.5.0
        - colorama >=0.4.0
        - impit >=0.8.0
        - more-itertools >=10.2.0
        - protego >=0.5.0
        - psutil >=6.0.0
        - pydantic-settings >=2.12.0
        - pydantic >=2.11.0
        - pyee >=9.0.0
        - tldextract >=5.1.0
        - typing-extensions >=4.10.0
        - yarl >=1.18.0
    tests:
      - python:
          imports:
            - crawlee
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"

  - package:
      name: crawlee-with-adaptive-crawler
    build:
      noarch: python
      number: 0
    requirements:
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('crawlee', exact=True) }}
        - apify_fingerprint_datapoints >=0.0.3
        - browserforge >=1.2.4
        - jaro-winkler >=2.0.3
        - playwright >=1.27.0
        - scikit-learn >=1.6.0
    tests:
      - python:
          imports:
            - crawlee
          pip_check: false

  - package:
      name: crawlee-with-beautifulsoup
    build:
      noarch: python
      number: 0
    requirements:
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('crawlee', exact=True) }}
        - beautifulsoup4 >=4.12.0
        - lxml
        - html5lib >=1.0
    tests:
      - python:
          imports:
            - crawlee
          pip_check: false

  - package:
      name: crawlee-with-cli
    build:
      noarch: python
      number: 0
    requirements:
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('crawlee', exact=True) }}
        - cookiecutter >=2.6.0
        - inquirer >=3.3.0
        - rich >=13.9.0
        - typer >=0.12.0
    tests:
      - python:
          imports:
            - crawlee
          pip_check: false

  - package:
      name: crawlee-with-curl-impersonate
    build:
      noarch: python
      number: 0
    requirements:
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('crawlee', exact=True) }}
        - curl-cffi >=0.9.0
    tests:
      - python:
          imports:
            - crawlee
          pip_check: false

  - package:
      name: crawlee-with-httpx
    build:
      noarch: python
      number: 0
    requirements:
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('crawlee', exact=True) }}
        - apify_fingerprint_datapoints >=0.0.2
        - browserforge >=1.2.3
        - httpx >=0.27.0
        - brotli-python
        - h2
        - zstandard
    tests:
      - python:
          imports:
            - crawlee
          pip_check: false

  - package:
      name: crawlee-with-otel
    build:
      noarch: python
      number: 0
    requirements:
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('crawlee', exact=True) }}
        - opentelemetry-api >=1.34.1
        - opentelemetry-distro >=0.54
        - opentelemetry-exporter-otlp >=0.54
        - opentelemetry-instrumentation >=0.54
        - opentelemetry-instrumentation-httpx >=0.54
        - opentelemetry-sdk >=1.34.1
        - opentelemetry-semantic-conventions >=0.54
        - wrapt >=1.17.0
    tests:
      - python:
          imports:
            - crawlee
          pip_check: false

  - package:
      name: crawlee-with-parsel
    build:
      noarch: python
      number: 0
    requirements:
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('crawlee', exact=True) }}
        - parsel >=1.10.0
    tests:
      - python:
          imports:
            - crawlee
          pip_check: false

  - package:
      name: crawlee-with-playwright
    build:
      noarch: python
      number: 0
    requirements:
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('crawlee', exact=True) }}
        - apify_fingerprint_datapoints >=0.0.2
        - browserforge >=1.2.3
        - playwright >=1.27.0
    tests:
      - python:
          imports:
            - crawlee
          pip_check: false

  - package:
      name: crawlee-with-redis
    build:
      noarch: python
      number: 0
    requirements:
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('crawlee', exact=True) }}
        - redis-py >=7.0.0
        - hiredis
    tests:
      - python:
          imports:
            - crawlee
          pip_check: false

  - package:
      name: crawlee-with-sql-mysql
    build:
      noarch: python
      number: 0
    requirements:
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('crawlee', exact=True) }}
        - sqlalchemy >=2.0.0,<3.0.0
        - aiomysql >=0.3.2
        - cryptography >=46.0.5
    tests:
      - python:
          imports:
            - crawlee
          pip_check: false

  - package:
      name: crawlee-with-sql-postgres
    build:
      noarch: python
      number: 0
    requirements:
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('crawlee', exact=True) }}
        - sqlalchemy >=2.0.0,<3.0.0
        - asyncpg >=0.24.0
    tests:
      - python:
          imports:
            - crawlee
          pip_check: false

  - package:
      name: crawlee-with-sql-sqlite
    build:
      noarch: python
      number: 0
    requirements:
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('crawlee', exact=True) }}
        - sqlalchemy >=2.0.0,<3.0.0
        - aiosqlite >=0.21.0
    tests:
      - python:
          imports:
            - crawlee
          pip_check: false

  - package:
      name: crawlee-all
    build:
      noarch: python
      number: 0
    requirements:
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('crawlee', exact=True) }}
        - ${{ pin_subpackage('crawlee-with-adaptive-crawler', exact=True) }}
        - ${{ pin_subpackage('crawlee-with-beautifulsoup', exact=True) }}
        - ${{ pin_subpackage('crawlee-with-cli', exact=True) }}
        - ${{ pin_subpackage('crawlee-with-curl-impersonate', exact=True) }}
        - ${{ pin_subpackage('crawlee-with-httpx', exact=True) }}
        - ${{ pin_subpackage('crawlee-with-otel', exact=True) }}
        - ${{ pin_subpackage('crawlee-with-parsel', exact=True) }}
        - ${{ pin_subpackage('crawlee-with-playwright', exact=True) }}
        - ${{ pin_subpackage('crawlee-with-redis', exact=True) }}
        - ${{ pin_subpackage('crawlee-with-sql-mysql', exact=True) }}
        - ${{ pin_subpackage('crawlee-with-sql-postgres', exact=True) }}
        - ${{ pin_subpackage('crawlee-with-sql-sqlite', exact=True) }}
    tests:
      - python:
          imports:
            - crawlee
          pip_check: false

about:
  homepage: https://crawlee.dev/python
  summary: Crawlee for Python
  description: |
    Crawlee is a web scraping and browser automation library for Python.
    It helps you build reliable crawlers and handles request queues,
    autoscaling, proxy rotation, session management, and integration with
    HTTP clients and Playwright, so you can focus on the data extraction
    itself.
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://crawlee.dev/python/docs/quick-start
  repository: https://github.com/apify/crawlee-python

extra:
  recipe-maintainers:
    - Pijukatel
